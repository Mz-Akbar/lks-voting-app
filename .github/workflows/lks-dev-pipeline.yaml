  # Deploy application images to Docker Swarm and use docker-stack
  deploy:  
    name: Deploy Application into Docker Swarm
    runs-on: master # This job runs on the 'master' runner, which should be the Swarm manager
    needs: [master, node1, node2] # Ensure all pull jobs are done before deploying
    steps:
