name: Deploy Application into Docker Swarm

on:
  push:
    branches:
      - "dev"
    paths:
      - .github/workflows/lks-dev-pipeline.yaml
      - docker-stack.yml
      - README.md

env:
  AWS_REGION: "us-east-1"
  ENV: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  # Build image and push to ECR
  build:
    name: Build application images from source code and store them in the Amazon ECR
    runs-on: ubuntu-latest # This is a GitHub-hosted runner, Docker is pre-installed.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: lks-voting-image # This is the ECR repository name
          VOTE_IMAGE_TAG: vote-${{ env.ENV }}-latest
          RESULT_IMAGE_TAG: result-${{ env.ENV }}-latest
          WORKER_IMAGE_TAG: worker-${{ env.ENV }}-latest
        run: |
          echo "Building and pushing vote image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$VOTE_IMAGE_TAG --build-arg aws_region=${{ env.AWS_REGION }} --build-arg copy_or_mount="copy" -f vote/Dockerfile ./vote
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VOTE_IMAGE_TAG

          echo "Building and pushing result image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$RESULT_IMAGE_TAG --build-arg aws_region=${{ env.AWS_REGION }} --build-arg in_aws="yes" --build-arg copy_or_mount="copy" -f result/Dockerfile ./result
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$RESULT_IMAGE_TAG
          
          echo "Building and pushing worker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$WORKER_IMAGE_TAG --build-arg aws_region=${{ env.AWS_REGION }} --build-arg copy_or_mount="copy" -f worker/Dockerfile ./worker
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$WORKER_IMAGE_TAG

  # Pull Image to master runner
  master:
    name: Pull Image on master runner
    runs-on: master # This runs on your self-hosted 'master' EC2 instance
    needs: build # Depends on the 'build' job completing successfully
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials for Pull
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Pull images to master runner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: lks-voting-image # Must match the repository created in ECR
          VOTE_IMAGE_TAG: vote-${{ env.ENV }}-latest
          RESULT_IMAGE_TAG: result-${{ env.ENV }}-latest
          WORKER_IMAGE_TAG: worker-${{ env.ENV }}-latest
        run: |
          echo "Pulling images to master runner..."
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$VOTE_IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$RESULT_IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$WORKER_IMAGE_TAG
          docker images # Optional: show pulled images for verification

  # Pull Image to node1 runner
  node1:
    name: Pull Image on node1 runner
    runs-on: node1 # This runs on your self-hosted 'node1' EC2 instance
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials for Pull
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Pull images to node1 runner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: lks-voting-image # Must match the repository created in ECR
          VOTE_IMAGE_TAG: vote-${{ env.ENV }}-latest
          RESULT_IMAGE_TAG: result-${{ env.ENV }}-latest
          WORKER_IMAGE_TAG: worker-${{ env.ENV }}-latest
        run: |
          echo "Pulling images to node1 runner..."
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$VOTE_IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$RESULT_IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$WORKER_IMAGE_TAG

  # Pull Image to node2 runner
  node2:
    name: Pull Image on node2 runner
    runs-on: node2 # This runs on your self-hosted 'node2' EC2 instance
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials for Pull
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Pull images to node2 runner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: lks-voting-image # Must match the repository created in ECR
          VOTE_IMAGE_TAG: vote-${{ env.ENV }}-latest
          RESULT_IMAGE_TAG: result-${{ env.ENV }}-latest
          WORKER_IMAGE_TAG: worker-${{ env.ENV }}-latest
        run: |
          echo "Pulling images to node2 runner..."
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$VOTE_IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$RESULT_IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$WORKER_IMAGE_TAG
          
  # Deploy application images to Docker Swarm and use docker-stack
  deploy:  
    name: Deploy Application into Docker Swarm
    runs-on: master # This job runs on the 'master' runner, which should be the Swarm manager
    needs: [master, node1, node2] # Ensure all pull jobs are done before deploying
    steps:
      - name: Checkout Repository for Deployment
        uses: actions/checkout@v3

      - name: Deploy application images to Docker Swarm
        # This step assumes the 'master' runner is initialized as a Docker Swarm manager
        # and 'node1'/'node2' are joined as workers.
        # Images should already be pulled onto all relevant nodes by the previous jobs.
        run: |
          echo "Checking Docker Swarm status..."
          docker node ls || echo "Docker Swarm not initialized or nodes not joined. Please initialize Docker Swarm on master and join other nodes manually first."
          docker service ls
          docker stack ls
          
          echo "Removing previous stack (if exists)..."
          docker stack rm stackdemo || true # Use || true to prevent job failure if stack doesn't exist
          sleep 10 # Give some time for the stack to be removed

          echo "Deploying new stack..."
          # The images are assumed to be available on all nodes from the pull jobs.
          docker stack deploy --compose-file docker-stack.yml stackdemo
          
      # Removed redundant 'Configure AWS Credentials' as it's not needed for local Docker Swarm operations.
